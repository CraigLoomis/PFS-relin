[project]
name = "nirLinearity-validation"
version = "0.1.0"
description = "Validation harness for the lsst.obs.pfs.h4Linearity package (examples + tests)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "astropy>=6.0",
]

[dependency-groups]
dev = [
    "matplotlib>=3.10.8",
    "pytest>=8.0",
    "pytest-cov>=4.1",
    "ruff>=0.5",
]

[tool.uv]
# This project is the validation harness; the package under test
# (lsst.obs.pfs.h4Linearity) lives in a sibling product and is loaded
# via PYTHONPATH (see .env). uv should not try to build/install us.
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v"
pythonpath = [
    "examples",
    "/Users/cloomis/claude/obs_pfs/PIPE2D-1844/python",
]

[tool.ruff]
line-length = 110

[tool.ruff.lint]
# Keep the default E/F/W/I rules; do NOT enable pep8-naming ("N") rules
# because this project uses camelCase for functions/variables.
select = ["E", "F", "W", "I"]
